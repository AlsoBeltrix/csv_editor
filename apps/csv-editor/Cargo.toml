[package]
name = "csv-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "csv-editor"
description = "A streamlined spreadsheet-style editor for CSV files"

[lints]
workspace = true

[dependencies]
csv-editor-table = { workspace = true }
csv-editor-ui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# PNG encoding for the CSV_EDITOR_SCREENSHOT development aid.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
# Reading the system clipboard for the menu's Paste (Ctrl+V arrives through egui itself).
arboard = { version = "3.7", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
# Blocks on the start-up DirectX 12 adapter probe (`graphics.rs`); already in the tree via eframe.
pollster = "1"
